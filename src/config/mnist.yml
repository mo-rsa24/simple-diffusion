# ===================================================================
# BASE CONFIGURATION
# Defines the default parameters for all experiments using this file.
# ===================================================================
seed: 42

# --- Default Dataset Settings ---
dataset: &default_dataset
  name: MNIST
  data_dir: "./data"
  image_size: 32 # Padded to be a power of two
  channels: 1
  batch_size: 128
  num_workers: 4
  pin_memory: true

# --- Default Training Settings ---
training: &default_training
  epochs: 50
  log_every_step: 10000
  log_every_epoch: 10
  save_every_epoch: 25
  save_every_step: 10000
  resume_from: false

# --- Default Optimizer ---
optimizer: &default_optimizer
  type: Adam
  params:
    lr: !!float "2e-4"
    betas: [0.9, 0.999]

# --- Default Training Settings ---
diffusion: &default_diffusion
  timesteps: 1000
  loss_type: "l2"
  beta_start: 0.0001
  ema_decay: 0.9999
  beta_end: 0.02

# --- Default Logging ---
logging: &default_logging
  use_wandb: false
  use_tensorboard: false

# --- Default Sanity---
sanity: &default_sanity
  enabled: False
  num_examples: 10

# --- Default Sampling---
sampling: &default_sampling
  batch_size: 4
  channels: 1
  blit: true
  repeat_delay: 1000
  edm_sampler:
    params: { }

# --- Default Dirs---
dirs: &default_dirs
  cluster_base: "/gluster/mmolefe/PhD"
  local_base: .
  ckpt_dir: "./checkpoints"
  logs_dir: "./logs"
  hyperparameters_dir: "./hyperparameters"
  results_dir:
    base: "./results"
    samples: "./samples"
  tensorboard_dir: "./tensorboard"
  wandb_dir: "./wandb"

# ===================================================================
# MODEL-SPECIFIC OVERRIDES
# Each block contains parameters that will override the defaults
# when that model is selected via the -g <model_name> flag.
# ===================================================================
model:
  vanilla:
    # Vanilla Unet uses the default dataset and training settings.
    # We only override the learning rate.
    dirs:
      results_dir:
        side_by_side: "./side_by_side"
    optimizer:
      params:
        lr: 0.001
    architecture:
      dim: 64
      init_dim: 64
      out_dim: null
      dim_mults: [ 1, 2, 4, 8]
      channels: 1
      self_condition: false
      resnet_block_groups: 4
      use_attention_at: [ 1 ]

  vae:
    # VAE training requires its own specific parameters.
    # It inherits the default dataset settings.
    training:
      epochs: 50 # VAEs need sufficient training
    dirs:
      results_dir:
        latent_prior: "./latent_prior"
        latent_space: "./latent_space"
        reconstruction_error_distribution: "./latent_space"
        prior_samples: "./prior_samples"
    optimizer:
      params:
        lr: 0.001
    # VAE-specific model architecture params
    architecture:
      ddconfig:
        double_z: True
        z_channels: 4
        resolution: 32
        in_channels: 1
        out_ch: 1
        ch: 128
        ch_mult: [1, 2, 4, 4]
        num_res_blocks: 2
        attn_resolutions: [16]
        dropout: 0.0
      lossconfig:
        params:
          kl_weight: 0.000005
      embed_dim: 4

  ldm:
    # The LDM's Unet has its own architecture. # It will use the pre-trained VAE, so it doesn't need VAE params.
    dirs:
      results_dir:
        side_by_side: "./side_by_side"
    optimizer:
      params:
        lr: 0.0001
    architecture:
      dim: 64
      dim_mults: [1, 2, 4]
      resnet_block_groups: 4
      # 'channels' is set dynamically in run.py from the VAE

# ===================================================================
# EXPERIMENT PROFILES
# Defines sets of overrides that can be activated with --profile <name>
# This is perfect for sanity checks, debugging, or full production runs.
# ===================================================================
profiles:
  default:
    # The default profile has no overrides. It uses the settings defined above.
    description: "Standard training run with default parameters."

  sanity:
    # The 'sanity' profile is for quick overfitting tests.
    description: "A quick sanity check on a small batch to test for bugs."
    enabled: True
    num_examples: 10
    dataset:
      batch_size: 5 # Use a very small batch size
    diffusion:
      timesteps: 500
    training:
      epochs: 10 # Only run for a few epochs
      log_every_step: 5 # Log every single step. Should be same as num_examples
      log_every_epoch: 2
      save_every_epoch: 5
      save_every_step: 10
  debug:
    # The 'debug' profile disables logging for faster local iteration.
    description: "A debug run with logging disabled."
    logging:
      use_wandb: false
      use_tensorboard: false